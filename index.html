<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="theme-color" content="#0e0f12">
<title>Treino</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg: #0e0f12; --card: #1a1c21; --linha: #2a2d34; --texto: #f2f3f5; --fraco: #8b909a;
          --destaque: #3d8bfd; --ok: #2fbf71; --perigo: #ff5a5f; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--texto); font: 16px/1.4 -apple-system, system-ui, sans-serif;
         padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); }
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 52px;
           position: sticky; top: 0; background: var(--bg); z-index: 1; }
  header > :last-child { justify-self: end; }
  h1 { font-size: 18px; margin: 0; } h2 { font-size: 15px; color: var(--fraco); margin: 24px 0 8px; }
  h3 { font-size: 16px; margin: 0; color: var(--destaque); }
  button { font: inherit; color: inherit; border: 0; border-radius: 10px; cursor: pointer; }
  .primario { display: block; width: 100%; padding: 14px; margin: 12px 0; background: var(--destaque); font-weight: 600; }
  .secundario { width: 100%; padding: 10px; background: var(--linha); }
  .link { background: none; padding: 8px 0; color: var(--fraco); justify-self: start; }
  .destaque { color: var(--destaque); font-weight: 600; } .perigo { color: var(--perigo); }
  .centro { display: block; margin: 8px auto; }
  #cronometro { font-variant-numeric: tabular-nums; color: var(--fraco); }
  .card { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: 12px 14px;
          margin-bottom: 8px; background: var(--card); }
  .card span, .vazio, .resumo, .ant { color: var(--fraco); font-size: 14px; }
  .linha { display: flex; gap: 8px; margin-top: 24px; }
  .ex { background: var(--card); border-radius: 12px; padding: 12px; margin: 12px 0; }
  .ex-topo { display: flex; justify-content: space-between; align-items: center; }
  .ex ol { margin: 8px 0 0; padding-left: 20px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; text-align: center; font-variant-numeric: tabular-nums; }
  th { font-size: 12px; color: var(--fraco); font-weight: 500; padding: 4px 0; }
  td { padding: 3px 2px; }
  td input { width: 100%; max-width: 64px; padding: 8px 4px; text-align: center; font-size: 16px; color: var(--texto);
             background: var(--linha); border: 0; border-radius: 8px; }
  tr.feita td { background: rgba(47, 191, 113, .15); }
  tr.feita input { background: transparent; }
  .check { width: 36px; height: 36px; background: var(--linha); color: var(--fraco); }
  tr.feita .check { background: var(--ok); color: #fff; }
  .campo { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; color: var(--texto); background: var(--card);
           border: 0; border-radius: 10px; }
  main { padding-bottom: 72px; }
  .rotina { flex-direction: row; align-items: center; padding: 0 14px 0 0; }
  .rotina .corpo { flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 14px;
                   background: none; min-width: 0; }
  .rotina .corpo span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contador { display: flex; align-items: center; gap: 8px; color: var(--fraco); font-size: 14px; white-space: nowrap; }
  .contador button:not(.x) { width: 32px; height: 32px; background: var(--linha); }
  .x { width: 28px; height: 32px; background: none; color: var(--fraco); font-size: 20px; padding: 0; }
  #descanso { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px;
              padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); background: var(--destaque); }
  #descanso span { flex: 1; } #descanso b { font-variant-numeric: tabular-nums; font-size: 20px; margin-left: 4px; }
  #descanso button { padding: 8px 10px; background: rgba(0, 0, 0, .25); }
  .grafico { width: 100%; height: auto; background: var(--card); border-radius: 12px; }
  .grafico text { fill: var(--fraco); font-size: 10px; }
  .item { display: block; width: 100%; text-align: left; padding: 14px 4px; background: none;
          border-bottom: 1px solid var(--linha); border-radius: 0; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module" src="app.js"></script>
</body>
</html>
